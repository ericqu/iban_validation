[build-system]
requires = ["maturin==1.7.1"]
build-backend = "maturin"

[project]
name = "iban_validation_polars"
description = "A package to facilitate validation of IBANs and selecting Bank identifier and Branch identifier as a Polars plugin"
long_description = "A package to facilitate validation of IBANs and selecting Bank identifier and Branch identifier as a Polars plugin"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eric" }
]
keywords = ["iban", "validation", "banking", "finance", "sepa", "polars", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/ericqu/iban_validation/tree/main/iban_validation_polars"
Documentation = "https://github.com/ericqu/iban_validation/tree/main/iban_validation_polars#readme"
Repository = "https://github.com/ericqu/iban_validation"
Issues = "https://github.com/ericqu/iban_validation/issues"
