[package]
name = "iban_validation_rs"
version = { workspace = true }
edition = { workspace = true }
authors = [ "Eric Quéré" ]
readme = "README.md"
homepage = "https://github.com/ericqu/iban_validation"
license = "MIT"
repository = "https://github.com/ericqu/iban_validation"
description = "Facilitate validation of ibans and selecting Bank identifier and Branch identifier in Rust."
exclude = ["benches/", "data/IBAN Examples.txt", "examples/"]
documentation = "https://docs.rs/iban_validation_rs"
keywords = ["iban", "validation", "banking", "finance", "sepa"]
categories = ["finance", "parser-implementations", "text-processing"]
rust-version = "1.85"

[dependencies]

[features]
default = []
# Accepts IBAN-shaped account numbers for 22 countries that use an IBAN-shaped
# account number but are not published in the official SWIFT IBAN registry.
# This data is community-sourced (schwifty's overwrite.json), not
# SWIFT-registered, so treat it as a weaker guarantee than the default set.
non_registry = []

[dev-dependencies]
criterion = "0.5"
divan = "0.1.17"
proptest = "1"

[[bench]]
name = "speed_bench"
harness = false

[[bench]]
name = "speed_bench_divan"
harness = false
