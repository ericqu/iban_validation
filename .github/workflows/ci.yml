name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml pins `x86_64-unknown-linux-gnu-gcc` as the linker for this
  # target, which is what cross-building releases from macOS needs. On a Linux
  # runner that target is the *host*, and that cross-toolchain binary does not
  # exist, so point it back at the native linker. Cargo gives environment
  # variables precedence over .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets covers tests and benches, not just the lib.
      - name: Clippy
        run: |
          cargo clippy -p iban_validation_rs --all-targets -- -D warnings
          cargo clippy -p iban_validation_rs --all-targets --features non_registry -- -D warnings
          cargo clippy -p iban_validation_c --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test -p iban_validation_rs
          cargo test -p iban_validation_rs --features non_registry
          cargo test -p iban_validation_c

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 1.85 toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version

      - name: Check
        run: cargo check -p iban_validation_rs --all-features
