# Cross-compilation linkers used to live here, but settings in this file apply to
# every cargo invocation -- including native builds on Linux, where
# x86_64-unknown-linux-gnu is the host target and the cross toolchain is absent.
# That broke `cargo build` for CI and for anyone on Linux.
#
# They now live in the Makefile (LINUX_X8_LINKER / WINDOWS_GNU_LINKER), passed as
# CARGO_TARGET_<TRIPLE>_LINKER only on the cross-build invocations that need them.
